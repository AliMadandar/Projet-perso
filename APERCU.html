<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f6f8"><title>Rivqo · Devis et facturation</title><link rel="icon" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA2NCA2NCIgcm9sZT0iaW1nIj4KICA8dGl0bGU+Uml2cW88L3RpdGxlPgogIDxyZWN0IHdpZHRoPSI2NCIgaGVpZ2h0PSI2NCIgcng9IjE0IiBmaWxsPSIjMzAyMjRhIi8+CiAgPHBhdGggZmlsbD0iI2ZmZjRlNSIgZD0iTTE1IDQ2VjI5QzE1IDIxIDIxIDE1IDI5IDE1SDQ2UTQ5IDE1IDQ5IDE4VjIzUTQ5IDI2IDQ2IDI2SDMyUTI2IDI2IDI2IDMyVjQ2UTI2IDQ5IDIzIDQ5SDE4UTE1IDQ5IDE1IDQ2WiIvPgogIDxyZWN0IHg9IjM0IiB5PSIzNCIgd2lkdGg9IjE1IiBoZWlnaHQ9IjE1IiByeD0iMi44IiBmaWxsPSIjZmZiYTkxIi8+Cjwvc3ZnPgo="><script>(() => {
  const dayStart = 7;
  const nightStart = 20;
  const storageKey = 'rivqo-theme-preference';
  const root = document.documentElement;
  const themeColor = document.querySelector('meta[name="theme-color"]');
  let preference = 'auto';
  let timer;

  function updateTheme() {
    clearTimeout(timer);
    const now = new Date();
    const hour = now.getHours();
    const nighttime = hour < dayStart || hour >= nightStart;
    const dark = preference === 'dark' || (preference === 'auto' && nighttime);
    root.dataset.theme = dark ? 'dark' : 'light';
    if (themeColor) themeColor.content = dark ? '#17181c' : '#f5f6f8';

    if (preference !== 'auto') return;
    const next = new Date(now);
    if (hour >= nightStart) next.setDate(next.getDate() + 1);
    next.setHours(dark ? dayStart : nightStart, 0, 0, 0);
    // Recheck the device clock after sleep or a change of time zone.
    timer = setTimeout(updateTheme, Math.min(next - now, 60_000));
  }

  function usePreference(value) {
    preference = value === 'light' || value === 'dark' ? value : 'auto';
    updateTheme();
    window.dispatchEvent(new Event('rivqo:appearance'));
  }

  window.rivqoTheme = {
    get preference() {
      return preference;
    },
    setPreference(value) {
      usePreference(value);
      try {
        localStorage.setItem(storageKey, preference);
        return true;
      } catch {
        return false;
      }
    }
  };

  let saved;
  try { saved = localStorage.getItem(storageKey); } catch {}
  usePreference(saved);
  window.addEventListener('storage', event => {
    if (event.storageArea === localStorage && (event.key === storageKey || event.key === null)) {
      usePreference(event.newValue);
    }
  });
  window.addEventListener('pageshow', updateTheme);
  window.addEventListener('focus', updateTheme);
  document.addEventListener('visibilitychange', updateTheme);
})();

/* Typographie et couleurs de l’interface et du document imprimable. */
:root {
  --font-ui: -apple-system, BlinkMacSystemFont, "Inter UI", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --paper-ink: #282038;
  --paper-muted: #62596c;
  --paper-rule: #e6dfe9;
  --plum: #654888;
  --apricot: #ffba91;
  --ink: #22242b;
  --muted: #505663;
  --rule: #e0e3ea;
  --bg: #f5f6f8;
  --surface: #fff;
  --surface-tint: #eceef3;
  --selected: #e5ebfd;
  --field-border: #7d8291;
  --action: #3153c3;
  --action-hover: #3457c8;
  --on-action: #fff;
  --button-sheen: #ffffff24;
  --button-halo: #3153c32e;
  --accent-text: #2c469f;
  --focus: #3c58b8;
  --feature-start: #edebfa;
  --feature-end: #ffece5;
  --feature-decoration: #b49bec;
  --metal-mark: linear-gradient(142deg, #9c80cd 4%, #d5c5f4 25%, #f9f2ff 36%, #bca9e4 49%, #ddd1f7 66%, #9a7dce 100%);
  --metal-tile: linear-gradient(150deg, #ffe4cb 4%, #fff1e4 28%, #ffc09a 56%, #e68e6e 100%);
  --satin-reflection: #ffffffbd;
  --draft-card: #e8dfff;
  --draft-edge: #a382e5;
  --draft-accent: #563392;
  --sent-card: #d8eeff;
  --sent-edge: #70b7f0;
  --sent-accent: #195491;
  --accepted-card: #daf5e7;
  --accepted-edge: #6cc8a4;
  --accepted-accent: #1e6249;
  --radius: 14px;
  color-scheme: light;
  font: 15px/1.5 var(--font-ui);
  color: var(--ink);
  background: var(--bg);
}
@media screen {
  :root[data-theme="dark"] {
    --ink: #f1f2f5;
    --muted: #bfc3cf;
    --rule: #383a43;
    --bg: #17181c;
    --surface: #212228;
    --surface-tint: #282a31;
    --selected: #29354f;
    --field-border: #858a9b;
    --action: #adc2ff;
    --action-hover: #c6d5ff;
    --on-action: #20283f;
    --button-sheen: #ffffff3b;
    --button-halo: #adc2ff3d;
    --accent-text: #b7caff;
    --focus: #a1b8ff;
    --feature-start: #252437;
    --feature-end: #302624;
    --feature-decoration: #766199;
    --metal-mark: linear-gradient(142deg, #564169 4%, #8b74a8 25%, #c2b2d5 36%, #76618d 49%, #a48bb9 66%, #5b466f 100%);
    --metal-tile: linear-gradient(150deg, #ad735e 4%, #efbba6 28%, #c08065 56%, #87513e 100%);
    --satin-reflection: #ffffff12;
    --draft-card: #2c243c;
    --draft-edge: #8862be;
    --draft-accent: #ceb6fa;
    --sent-card: #202f43;
    --sent-edge: #508cc9;
    --sent-accent: #a7d8ff;
    --accepted-card: #20352e;
    --accepted-edge: #4c9c7a;
    --accepted-accent: #a1e4ca;
    color-scheme: dark;
  }
  :root[data-theme="dark"] .badge:not(.b1, .b2, .b3, .b4) { background: #363944; color: #e1e3ea; }
  :root[data-theme="dark"] .b3 { background: #49332e; color: #f0c7b8; }
}
*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}
button {
  cursor: pointer;
  border: 1px solid var(--rule);
  border-radius: 8px;
  background: var(--surface);
  color: var(--ink);
  padding: 9px 14px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  font-weight: 600;
  line-height: 1.35;
}
button:disabled { opacity: .6; cursor: default; }
button svg { flex-shrink: 0; }
button.primary {
  background-color: var(--action);
  background-image: linear-gradient(180deg, var(--button-sheen), transparent 75%);
  border-color: var(--action);
  color: var(--on-action);
  box-shadow: inset 0 1px 0 #ffffff30, 0 2px 5px #14172c1a;
}
button.subtle,.link{border-color:transparent;background:transparent;padding:6px;color:var(--accent-text)}
.link{padding:2px 0;text-align:left;justify-content:flex-start}
.wide{width:100%;margin-top:10px}.icononly{width:34px;height:34px;padding:6px;font-size:0;gap:0}
.skip{position:fixed;top:-100px;background:var(--surface);padding:10px;z-index:20}.skip:focus{top:0}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
@media screen and (hover: hover) and (pointer: fine) {
  button:where(:enabled):hover {
    background-color: var(--surface-tint);
    border-color: var(--field-border);
  }
  button.primary:where(:enabled):hover {
    background-color: var(--action-hover);
    border-color: var(--action-hover);
    box-shadow: inset 0 1px 0 #ffffff70, 0 4px 15px var(--button-halo);
  }
  button:where(:enabled:not(.primary, .link, .nav)):hover {
    box-shadow: inset 0 0 0 1px var(--button-halo), 0 3px 11px var(--button-halo);
  }
}
@media screen and (hover: hover) and (pointer: fine) and (prefers-reduced-motion: no-preference) {
  button:where(:enabled:not(.link, .nav)) {
    transition: transform 150ms ease-out, box-shadow 150ms ease-out, background-color 150ms ease-out, border-color 150ms ease-out;
  }
  button:where(:enabled:not(.link, .nav)):hover { transform: scale(1.035); }
  button:where(:enabled:not(.link, .nav)):active { transform: scale(.985); }
}
h1,h2,h3,p{margin:0}h1{font-weight:720;font-size:clamp(32px,4vw,54px);letter-spacing:-.055em;line-height:1.14}h2{font-size:22px;letter-spacing:-.04em;line-height:1.25}h3{font-size:17px;letter-spacing:-.02em}p{color:var(--muted)}small{display:block;color:var(--muted);line-height:1.45}.eyebrow,.sheet small,.previewtitle{font-size:11px;font-weight:750;text-transform:uppercase;letter-spacing:.12em}
a{color:var(--accent-text)}
::placeholder{color:var(--muted);opacity:1}
.shell{display:grid;grid-template-columns:222px minmax(0,1fr);min-height:100vh}aside{height:100dvh;position:sticky;top:0;padding:30px 16px 16px;background:var(--surface-tint);color:var(--ink);border-inline-end:1px solid var(--rule);display:flex;flex-direction:column}.brand{display:inline-flex;align-items:center;gap:9px;font-size:15px;letter-spacing:-.015em;white-space:nowrap}.brand img{width:41px;height:41px}.brand b{font-weight:760}nav{margin-top:45px;display:grid;gap:5px}.nav{justify-content:flex-start;color:var(--muted);background:none;border:0;padding:12px 15px;font-size:14px}.nav:hover,.nav.active{background:var(--selected);color:var(--accent-text)}.nav.active{box-shadow:inset 3px 0 var(--focus)}.profile{margin-top:auto;display:flex;align-items:center;gap:8px;border-top:1px solid var(--rule);padding-top:19px;font-size:12px}.avatar{width:38px;height:38px;border-radius:50%;background:var(--selected);color:var(--ink);display:inline-grid;place-items:center;font-weight:750}.profile small{color:var(--muted)}.profile button{margin-left:auto;background:transparent;border:none;color:var(--accent-text)}.workspace{min-width:0}.bar{height:67px;border-bottom:1px solid var(--rule);background:var(--surface);display:flex;align-items:center;gap:12px;padding:0 clamp(18px,3vw,48px);font-size:13px;color:var(--muted)}.bar i{font-style:normal;margin:0 8px;color:var(--muted)}.bar>button:last-child{margin-left:auto}.mobilemenu{display:none}main#main{max-width:1750px;margin:auto;padding:30px clamp(16px,3vw,48px) 70px}.hero,.signart{color:var(--ink);position:relative;overflow:hidden}.hero{padding:35px clamp(22px,3vw,44px);border-radius:var(--radius);isolation:isolate}.hero>div:last-child{position:relative}.hero h1{font-size:clamp(36px,4.2vw,62px);margin:12px 0}.hero .eyebrow,.signart .eyebrow{color:var(--accent-text)}.hero .primary{margin-top:24px}.drafting{position:absolute;right:-1.5rem;bottom:-2.5rem;width:min(38%,330px);aspect-ratio:1;opacity:.60;pointer-events:none}
.drafting::before,.drafting::after{content:"";position:absolute}
.drafting::before{inset:8% 12% 14% 5%;border:clamp(18px,4vw,52px) solid var(--feature-decoration); border-right:0;border-bottom:0;border-radius:42% 8px 0 8px;opacity:.15}
.drafting::after{right:12%;bottom:14%;width:35%;aspect-ratio:1;border-radius:18%;background:var(--apricot);opacity:.22}
.signart{background:linear-gradient(145deg,var(--feature-start),var(--feature-end))}
.hero {
  background: var(--surface);
  border: 1px solid var(--rule);
}
.hero .drafting { opacity: 1; }
.hero .drafting::before { opacity: .68; }
.hero .drafting::after {
  background: var(--metal-tile);
  opacity: 1;
  box-shadow: inset 0 1px 0 #ffffff70, 0 6px 18px #1213231c;
}
@supports (mask-composite: exclude) {
  .hero .drafting::before {
    border-color: transparent;
    background: var(--metal-mark) border-box;
    mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0) border-box;
    mask-composite: exclude;

/* La même grille sert à la feuille éditable, au portail et au PDF. */
.quote-document {
  --quote-accent: var(--accent, var(--plum));
  --quote-tint: var(--tint, #f1ebf5);
  --quote-rule: var(--rule);
  color: var(--ink);
  background: #fff;
}
.quote-document.tone-prune {
  --accent: var(--plum);
  --tint: #f1ebf5;
}
.quote-document .q-head { padding-bottom: 0; }
.quote-document .q-brand b {
  white-space: normal;
  overflow-wrap: anywhere;
}
.quote-document .q-brand img { flex: 0 0 auto; }
.quote-document .quote-reference {
  color: var(--muted);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: .04em;
  text-align: end;
  text-transform: uppercase;
}
.quote-document .quote-reference strong { white-space: nowrap; }
.quote-document .q-title {
  border: 0;
  padding: 0;
}
.quote-document .q-title h2 {
  color: var(--quote-accent);
  font-size: clamp(24px, 6cqi, 40px);
  line-height: 1.12;
}
.quote-document .q-meta {
  justify-content: flex-start;
  column-gap: 16px;
  padding: 0 0 10px;
  border: 0;
  border-bottom: 1px solid var(--quote-rule);
  color: var(--muted);
  font-size: 12px;
}
.quote-document .q-parties > section {
  min-width: 0;
  overflow-wrap: anywhere;
  font-size: 11px;
}
.quote-items { font-variant-numeric: tabular-nums; font-size: 13px; }
.quote-items thead th {
  padding: 8px;
  background: #fff;
  color: var(--muted);
  font-size: .9em;
  letter-spacing: 0;
  text-transform: none;
  border-top: 0;
  border-bottom: 1px solid var(--quote-rule);
}
.quote-items thead th:first-child { width: 46%; }
.quote-items td {
  padding: 9px 8px;
  vertical-align: top;
  border: 0;
  border-bottom: 1px solid var(--quote-rule);
}
.quote-items .quote-cell { text-align: end; }
.quote-items .quote-description { overflow-wrap: anywhere; }
.quote-items .quote-description small {
  margin-top: 2px;
  color: var(--muted);
  font-size: .85em;
  font-weight: 400;
  text-transform: none;
  letter-spacing: 0;
}
.quote-items .quote-total { color: var(--ink); font-weight: 700; }
.quote-items .q-lot th {
  width: auto;
  padding: 7px 8px;
  background: var(--quote-tint);
  color: var(--quote-accent);
  border: 0;
  text-align: start;
  text-transform: none;
  letter-spacing: 0;
  font-size: .95em;
}
.quote-items .quote-subtotal > * {
  padding: 5px 8px 9px;
  border: 0;
  background: transparent;
  color: var(--muted);
  font-size: .9em;
  font-weight: 400;
  text-transform: none;
  letter-spacing: 0;
}
.quote-items .quote-subtotal td { text-align: end; color: var(--quote-accent); }
.quote-cell-label { display: none; }
.quote-document .q-sum,
.quote-document .totals,
.quote-document .q-pay { font-variant-numeric: tabular-nums; }
.quote-document .q-sum { width: min(100%, max(250px, 50%)); }
.quote-document .q-sum > div { padding-inline: 10px; font-size: 12px; }
.quote-document .q-grand,
.quote-document .totals .grand {
  padding: 9px 11px;
  border-radius: 6px;

function amounts(lines, discount = 0, deposit = 0) {
  const taxGroups = new Map();
  let gross = 0,
    net = 0;
  for (const l of lines) {
    const raw = Math.round(l.quantity * l.price / 100);
    const base = Math.round(raw * (10000 - discount) / 10000);
    gross += raw;
    net += base;
    taxGroups.set(l.tax, (taxGroups.get(l.tax) || 0) + base);
  }
  const taxes = Array.from(taxGroups, ([rate, base]) => ({
    rate,
    base,
    amount: Math.round(base * rate / 10000)
  })).sort((a, b) => a.rate - b.rate);
  const tax = taxes.reduce((s, t) => s + t.amount, 0),
    total = net + tax;
  return {
    gross,
    discount: gross - net,
    net,
    tax,
    taxes,
    total,
    deposit: Math.round(total * deposit / 10000)
  };
}

return {euros,amounts};})();

// Normalise le format du navigateur en PCM mono 16 kHz pour l’API.
async function wavBase64(blob) {
  const context = new AudioContext();
  let source;
  try {
    source = await context.decodeAudioData(await blob.arrayBuffer());
  } finally {
    await context.close();
  }
  const render = new OfflineAudioContext(1, Math.ceil(source.duration * 16000), 16000);
  const player = render.createBufferSource();
  player.buffer = source;
  player.connect(render.destination);
  player.start();
  const pcm = (await render.startRendering()).getChannelData(0);
  const out = new ArrayBuffer(44 + pcm.length * 2),
    view = new DataView(out);
  function tag(offset, s) {
    for (let i = 0; i < s.length; i++) view.setUint8(offset + i, s.charCodeAt(i));
  }
  tag(0, 'RIFF');
  view.setUint32(4, out.byteLength - 8, true);
  tag(8, 'WAVE');
  tag(12, 'fmt ');
  view.setUint32(16, 16, true);
  view.setUint16(20, 1, true);
  view.setUint16(22, 1, true);
  view.setUint32(24, 16000, true);
  view.setUint32(28, 32000, true);
  view.setUint16(32, 2, true);
  view.setUint16(34, 16, true);
  tag(36, 'data');
  view.setUint32(40, pcm.length * 2, true);
  pcm.forEach((n, i) => view.setInt16(44 + 2 * i, Math.round(Math.max(-1, Math.min(1, n)) * 32767), true));
  const bytes = new Uint8Array(out);
  let text = '';
  for (let i = 0; i < bytes.length; i += 8192) text += String.fromCharCode(...bytes.subarray(i, i + 8192));
  return btoa(text);
}
async function startRecording(done) {
  const stream = await navigator.mediaDevices.getUserMedia({
    audio: true
  });
  try {
    const recorder = new MediaRecorder(stream),
      chunks = [];
    let discard = false;
    recorder.ondataavailable = e => chunks.push(e.data);
    const stop = (cancel = false) => {
      discard = cancel;
      if (recorder.state === 'recording') recorder.stop();
    };
    const timer = setTimeout(() => stop(), 120000);
    recorder.onstop = () => {
      clearTimeout(timer);
      stream.getTracks().forEach(t => t.stop());
      done(discard ? null : new Blob(chunks, {
        type: recorder.mimeType
      }));
    };
    recorder.start();
    return stop;
  } catch (e) {
    stream.getTracks().forEach(t => t.stop());
    throw e;
  }
}

return {wavBase64,startRecording};})();

      $('#briefAudio').src = playUrl;
    }
    b('mic').disabled = busy;
    b('send').disabled = busy || recording;
    b('mic').onclick = async () => {
      if (recording) return stop?.();
      try {
        b('mic').disabled = true;
        blob = null;
        const end = await startRecording(v => {
          stop = null;
          recording = false;
          blob = v;
          show();
        });
        if (!active) return end(true);
        stop = end;
        recording = true;

      if (!message.trim() && !blob) return toast('Saisissez ou dictez une demande.');

      e.preventDefault();

      const lines = data.getAll('line').map(i => ({

        tax: Math.round(Number(data.get('tax')) * 100)
      }));
      if (!lines.length) return toast('Sélectionnez au moins une ligne.');
      modal.close();
      apply(lines);
    };
  }
  show();
}

modules.photos=(()=>{
const { $, esc, input, dialog, onForm, button }=modules.ui;

function photosPaper(photos = []) {
  if (!photos.length) return '';
  return '<section class="annex"><h3>Photos du chantier</h3>' + photos.map(photo =>
    '<figure><img alt="' + esc(photo.caption || 'Vue du chantier') + '" src="data:image/jpeg;base64,' +
    esc(photo.jpeg) + '"><figcaption>' + esc(photo.caption) + '</figcaption></figure>'
  ).join('') + '</section>';
}

async function reducedImage(file) {
  if (!file || !['image/png', 'image/jpeg', 'image/webp'].includes(file.type) || file.size > 15000000) {
    throw Error('Choisissez un fichier JPEG, PNG ou WebP de moins de 15 Mo.');
  }
  const url = URL.createObjectURL(file);
  try {
    const image = new Image();
    image.src = url;
    await image.decode();
    const scale = Math.min(1, 1200 / Math.max(image.width, image.height));
    const canvas = document.createElement('canvas');
    canvas.width = Math.max(1, Math.round(image.width * scale));
    canvas.height = Math.max(1, Math.round(image.height * scale));
    const context = canvas.getContext('2d');
    context.fillStyle = '#ffffff';
    context.fillRect(0, 0, canvas.width, canvas.height);
    context.drawImage(image, 0, 0, canvas.width, canvas.height);
    for (const quality of [.78, .60, .42, .25]) {
      const jpeg = canvas.toDataURL('image/jpeg', quality).split(',')[1];
      if (jpeg.length <= 320000) return jpeg;
    }
    throw Error('Cette photo reste trop volumineuse. Recadrez-la puis réessayez.');
  } finally {
    URL.revokeObjectURL(url);
  }
}

function photoDialog(current, apply) {
  const photos = current.map(p => ({...p}));
  function draw() {
    dialog('Photos visibles par le client', photos.map((p, i) =>
      '<div class="member"><div><img class="thumb" alt="" src="data:image/jpeg;base64,' + esc(p.jpeg) +
      '"><b>' + esc(p.caption || 'Photo '+(i+1)) + '</b></div>' + button('remove-'+i,'Retirer','trash')+'</div>'
    ).join('') + (photos.length < 4 ? '<form id="photoForm"><label>Photo du chantier<input type="file" name="image" accept="image/jpeg,image/png,image/webp" required></label>' +
      input('Légende','caption','','text','maxlength="160"')+'<button>Ajouter la photo</button></form>' : '') +
      button('applyPhotos','Appliquer au devis','check','primary wide'));
    $('#modal').querySelectorAll('[data-act^="remove-"]').forEach(b => b.onclick=()=>{photos.splice(Number(b.dataset.act.slice(7)),1);draw();});
    if ($('#photoForm')) onForm('#photoForm',async o=>{
      const jpeg=await reducedImage(o.image);
      if(!$('#modal').open || !$('#photoForm')) return;
      photos.push({jpeg,caption:o.caption});draw();
    });
    $('[data-act="applyPhotos"]').onclick=()=>{$('#modal').close();apply(photos);};
  }
  draw();
}

return {photosPaper,photoDialog};})();

  const f=$('#editionForm'),v=f.elements;
  v.trade.onchange=()=>{v.color.value=trades[v.trade.value][0];v.spec.parentNode.firstChild.textContent=trades[v.trade.value][1];};
  let logo=e.logo||'';
  const logoLabel=()=>$('#logoState').textContent=logo?'Logo personnalisé sélectionné.':'Logo MA RENOVATION.';
  $('#customLogo').onchange=async ev=>{const f=ev.target.files[0];if(!f)return;if(!['image/png','image/jpeg'].includes(f.type)||f.size>240000){toast('Utilisez un PNG ou JPEG de moins de 240 Ko.');return;}
    const data=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(f);}).catch(()=>null);if(data&&$('#logoState')){logo=data;logoLabel();}};
  f.querySelector('[data-act="resetLogo"]').onclick=()=>{logo='';logoLabel();};logoLabel();
  const balance=()=>{const n=Math.round(Number(v.first.value)*100)+Math.round(Number(v.middle.value)*100);v.middle.setCustomValidity(n>10000?'Le total des deux échéances dépasse 100 %.':'');$('#rest').textContent=n<=10000?'Solde à la réception : '+pct(10000-n):'Le total dépasse 100 %.';};
  f.oninput=balance;balance();
  const values=()=>{const data=Object.fromEntries(new FormData(f));const {first,middle,...rest}=data;
    return {first:Math.round(Number(first)*100),edition:{...rest,logo,middle:Math.round(Number(middle)*100)}};};
  const reuse=()=>{const profile=state.profiles?.[v.trade.value]||{first:4000,edition:newEdition(v.trade.value)};
    for(const [k,val] of Object.entries(profile.edition))if(v[k])v[k].value=k==='middle'?val/100:val;
    v.first.value=profile.first/100;logo=profile.edition.logo||'';logoLabel();balance();};
  f.querySelector('[data-act="reuse"]').onclick=reuse;
  const preset=f.querySelector('[data-act="preset"]');
  if(preset)preset.onclick=async()=>{if(!f.reportValidity())return;const data=values();try{
    const saved=await api('profile',{...data,version:state.profiles?.[data.edition.trade]?.version||0});
    (state.profiles||={})[data.edition.trade]=saved;toast('Modèle enregistré pour ce domaine.');
  }catch(e){toast(e.message);}};
  onForm('#editionForm',async o=>{const {first,middle,...terms}=o;done({...terms,logo,middle:Math.round(Number(middle)*100)},Math.round(Number(first)*100));$('#modal').close();});
}

return {trades,lotIdeas,newEdition,installments,quoteItems,editionPaper,editionDialog};})();
modules.writer=(()=>{
const { $, esc, select, input, button, dialog, api }=modules.ui;
function localRewrite(raw,tone){
  let s=raw.trim().replace(/\s+/g,' ').replace(/\bm(?:2|ètre[s]? carr[ée]s?)\b/gi,'m²')
    .replace(/\bje (?:souhaite|veux) (?:faire )?poser\b/gi,'pose de').replace(/\bon (?:va )?pose(?:r)?\b/gi,'pose de')
    .replace(/\bon (?:va )?enl[eè]ve(?:r)?\b/gi,'dépose de').replace(/\bon (?:va )?pein(?:t|dre)\b/gi,'mise en peinture de')
    .replace(/\ble client (?:fournit|achète) (.+?)(?=[.;]|$)/gi,'$1 à la charge du client')
    .replace(/\b(?:et puis|ensuite on)\b/gi,'puis').replace(/\bde (les|le)\b/g,(_m,v)=>v==='les'?'des':'du');
  if(!s)return '';
  if(tone==='Plus lisible')s=s.replace(/\s*;\s*/g,'.\n').replace(/, puis /g,'.\nPuis ');
  return s.split('\n').map(line=>line[0]?.toLocaleUpperCase('fr')+line.slice(1)).join('\n').replace(/([^.!?])$/,'$1.');
}
function writer(state,d,apply){
  const targets=[['title','Objet du devis'],['notes','Précisions'],['terms','Conditions particulières'],...(d.edition?[['intro','Présentation du chantier'],['spec','Détail technique']]:[]),...d.lines.map((l,i)=>['line'+i,l.label])];
  const get=k=>k.startsWith('line')?d.lines[Number(k.slice(4))].label:(d.edition?.[k]??d[k]??'');
  let target=d.edition?'intro':'notes',history=[],source=get(target),candidate='',busy=false,generation=0;
  dialog('Assistant de rédaction','<div class="writing-chat">'+select('Texte à modifier','target',targets,target)+'<div id="messages" aria-live="polite"></div><label>Texte à reformuler<textarea id="writerText" rows="4"></textarea></label>'+input('Consigne pour Gemini (facultative)','instruction','','text','maxlength="600" placeholder="Ex. Précise qui fournit le carrelage"')+select('Style','tone',[['Professionnel','Professionnel'],['Plus lisible','Plus lisible']],'Professionnel')+'<div class="actions">'+button('local','Reformuler sur cet appareil','edit')+(state.ai?button('gem','Reformuler avec Gemini','arrow','primary'):'')+'</div><label>Proposition à relire<textarea id="suggestion" rows="4"></textarea></label>'+button('apply','Appliquer au champ choisi','check','primary wide')+'</div>');
  const root=$('#modal'),b=k=>root.querySelector('[data-act="'+k+'"]'),msg=$('#messages'),src=$('#writerText'),out=$('#suggestion');
  const refresh=()=>{msg.innerHTML=history.map(([who,t])=>'<p><b>'+esc(who)+'</b> '+esc(t)+'</p>').join('');b('apply').disabled=busy||!out.value.trim();};
  src.value=source;out.oninput=refresh;refresh();
  root.addEventListener('close',()=>generation++,{once:true});
  root.querySelector('[name=target]').onchange=e=>{generation++;target=e.target.value;source=get(target);candidate='';history=[];src.value=source;out.value='';busy=false;refresh();};
  async function ask(remote){
    const raw=src.value.trim();if(busy)return;
    if(!raw){history.push(['Assistant','Saisissez le texte à reformuler.']);refresh();return;}
    const job=++generation;
    busy=true;const tone=root.querySelector('[name=tone]').value;const instruction=root.querySelector('[name=instruction]').value.trim();history.push(['Vous',remote&&instruction?instruction+' — '+raw:raw]);refresh();
    try{
      const next=remote?(await api('rewrite',{text:raw,tone,instruction})).text:localRewrite(raw,tone);
      if(job!==generation)return;
      candidate=next;out.value=candidate;src.value=candidate;history.push([remote?'Gemini':'Assistant local',candidate]);
    }catch(e){if(job===generation)history.push(['Assistant',e.message+' Vous pouvez utiliser la reformulation locale.']);}
    finally{if(job===generation){busy=false;refresh();}}
  }
  b('local').onclick=()=>ask(false);if(b('gem'))b('gem').onclick=()=>ask(true);
  b('apply').onclick=()=>{const value=out.value.trim();const max=target==='title'?160:target.startsWith('line')?250:target==='intro'||target==='spec'?1500:4000;
    if(value.length>max){history.push(['Assistant','Raccourcissez la proposition à '+max+' caractères pour ce champ.']);refresh();return;}
    if(value){apply(target,value);root.close();}
  };
}

return {localRewrite,writer};})();

 const msg=isReminder?(r?.message||'Bonjour,\n\nAvez-vous pu consulter notre devis '+d.number+' pour '+d.title+' ? Nous restons disponibles pour en discuter.\n\nMA RENOVATION'):'Bonjour,\n\nVous trouverez en pièce jointe notre devis '+d.number+' pour '+d.title+'. Nous restons disponibles pour toute précision.\n\nMA RENOVATION';

modules.sheet=(()=>{
function bindSheet(root,d,changed,lineDialog,style,moveLine){
  function text(el,object,key,label,max){
    if(!el)return;
    el.textContent=object[key]||'';
    el.contentEditable='plaintext-only';el.dataset.hint=label;el.setAttribute('role','textbox');el.setAttribute('aria-label',label);
    el.oninput=()=>{object[key]=el.innerText.slice(0,max);if(el.innerText.length>max)el.textContent=object[key];changed();};
    el.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();el.blur();}};
  }
  function action(el,label,fn){
    if(!el)return;
    el.classList.add('sheet-target');el.tabIndex=0;el.setAttribute('role','button');el.setAttribute('aria-label',label);el.title=label;el.onclick=fn;
    el.onkeydown=e=>{if([' ','Enter'].includes(e.key)){e.preventDefault();fn();}};
  }
  text(root.querySelector('.q-title h2'),d,'title','Objet du devis',160);
  text(root.querySelector('.q-parties section:last-child strong'),d.client,'name','Nom du client',120);
  let address=root.querySelector('.q-title p');
  if(!address){address=document.createElement('p');root.querySelector('.q-title').append(address);}
  text(address,d,'site','Adresse du chantier',250);
  const facts={'Objet des travaux':'intro','Spécifications':'spec','Fournitures':'supply','Paiement':'payment','Intervention':'timing','Gestion des déchets':'waste','Précisions':'notes','Conditions particulières':'terms'};
  for(const f of root.querySelectorAll('.quote-fact')){
    const label=f.querySelector('b')?.textContent,k=facts[label];if(k)text(f.querySelector('p'),['notes','terms'].includes(k)?d:d.edition,k,label,['notes','terms'].includes(k)?4000:1500);
  }
  let dragged=-1;
  const rows=root.querySelectorAll('.quote-line, .quote-empty');
  rows.forEach((row,index)=>{
    action(row,d.lines[index]?'Modifier '+d.lines[index].label:'Ajouter une prestation',()=>lineDialog(d.lines[index]?index:-1));
    if(!d.lines[index]||rows.length<2)return;
    row.draggable=true;
    row.title='Cliquer pour modifier, glisser pour déplacer';
    row.ondragstart=e=>{dragged=index;e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',String(index));};
    row.ondragover=e=>{if(dragged>=0){e.preventDefault();row.classList.add('drop-line');}};
    row.ondragleave=()=>row.classList.remove('drop-line');
    row.ondrop=e=>{e.preventDefault();if(dragged>=0&&dragged!==index)moveLine(dragged,index);dragged=-1;row.classList.remove('drop-line');};
    row.ondragend=()=>{dragged=-1;rows.forEach(r=>r.classList.remove('drop-line'));};
  });
  action(root.querySelector('.q-brand'),'Personnaliser le logo et les couleurs',style);
  action(root.querySelector('.q-pay'),'Modifier les échéances',style);
}

return {bindSheet};})();

  const b=$('#modal [data-act=issue]');if(b)b.onclick=issue;
 }
 function back(){const b=$('#modal [data-act=ledger]');if(b)b.onclick=show;}
 function view(i){
  dialog(i.number,button('ledger','Revenir au suivi du devis','back')+button('printBill','Imprimer / PDF','print')+invoicePaper(i)+'<h3>Règlements reçus</h3>'+i.payments.map(p=>'<p>'+dateLabel(p.day)+' · '+esc(p.method)+' · '+euros(p.amount)+'</p>').join(''));
  back();$('#modal [data-act=printBill]').onclick=()=>{
    const copy=document.createElement('div');copy.className='invoice-print';copy.innerHTML=invoicePaper(i);document.body.append(copy);document.body.classList.add('printing-invoice');

  };
 }
 function issue(){

  const f=$('#issueForm');f.elements.kind.onchange=()=>{if(f.elements.kind.value==='Solde')f.elements.amount.value=remain/100;};
  onForm('#issueForm',async o=>{if(!confirm('Émettre définitivement cette facture de '+o.amount+' € TTC ?'))return;book=await api('invoice',{...o,id:d.id,amount:Math.round(Number(o.amount)*100),count:book.invoices.length,request:key});show();toast('Facture émise.');});
 }
 function payment(i){
  const left=i.total-paid(i),key=crypto.randomUUID();
  dialog('Règlement · '+i.number,button('ledger','Retour au suivi','back')+'<form id="paymentForm">'+input('Montant reçu (€)','amount',left/100,'number','required min=".01" max="'+left/100+'" step=".01"')+input('Date d’encaissement','day',today(),'date','required')+select('Mode de paiement','method',['Virement','Chèque','Carte','Espèces'].map(x=>[x,x]),'Virement')+'<button class="primary">Enregistrer le règlement</button></form>');back();
  onForm('#paymentForm',async o=>{book=await api('payment',{...o,id:d.id,seq:i.seq,amount:Math.round(Number(o.amount)*100),request:key});show();});
 }
 show();
}

  if(dirty()&&!confirm('Quitter sans enregistrer les modifications du devis ?'))return;
  const data=await api('state');
  if(ticket!==navigation||page!==from||session!==epoch)return;
  if ((state.events[0]?.id || 0) > (data.events[0]?.id || 0)) data.events = state.events;
  data.lastRead = Math.max(data.lastRead, state.lastRead);
  state=data;go(destination,null,true);

}

      const newEvents = events.filter(e => e.id > lastEvent);
      lastEvent = events[0].id;
      if (lastEvent >= (state.events[0]?.id || 0)) state.events = events;
      const b = $('.bar [data-act="nav-Activité"]');
      const unread = state.events.filter(e => e.id > state.lastRead).length;
      if (b) b.innerHTML = icon('bell') + 'Activité' + (unread ? ' (' + unread + ')' : '');
      if (page === 'Activité') activity($('#main'));
      const replies = newEvents.filter(e => e.id > state.lastRead &&
        ['Réponse client · Accepté', 'Réponse client · Refusé'].includes(e.action));
      if (replies.length) showClientReplies(replies);
      if ('Notification' in window && Notification.permission === 'granted' && document.hidden) new Notification('Rivqo', {
        body: (replies[0] || newEvents[0]).action
      });
    } catch {}
  }, 20000);
}
window.addEventListener('sessionexpired', login);
window.addEventListener('focus', updateNotificationPreference);
window.addEventListener('rivqo:appearance', () => {
  const selected = $('.theme-options input[value="' + window.rivqoTheme.preference + '"]');
  if (selected) selected.checked = true;
});
window.addEventListener('beforeunload', e => {
  if (dirty()) {
    e.preventDefault();
    e.returnValue = '';
  }
});
if(false) navigator.serviceWorker.register('/sw.js').catch(() => {});
start().catch(login);

return {};})();
</script></body></html>
