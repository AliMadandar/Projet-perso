/* La même grille sert à la feuille éditable, au portail et au PDF. */
.quote-document {
  --quote-accent: var(--accent, #163d35);
  --quote-tint: var(--tint, #eaf1eb);
  --quote-rule: #dce2dc;
  background: #fff;
}
.quote-document .q-brand b {
  white-space: normal;
  overflow-wrap: anywhere;
}
.quote-document .q-parties > section { min-width: 0; overflow-wrap: anywhere; }
.quote-items { font-variant-numeric: tabular-nums; font-size: 12px; }
.quote-items thead th {
  padding: 9px 6px;
  background: #edf1ed;
  color: #213e36;
  font-size: .85em;
  letter-spacing: 0;
  border-block: 1px solid var(--quote-rule);
}
.quote-items td { padding: 9px 6px; border-bottom-color: var(--quote-rule); }
.quote-items .quote-description { overflow-wrap: anywhere; }
.quote-items .quote-description small { margin-top: 3px; font-size: .85em; }
.quote-items .quote-total { font-weight: 700; }
.quote-items .q-lot th {
  width: auto;
  padding: 7px 6px;
  background: var(--quote-tint);
  color: var(--quote-accent);
  border-bottom: 0;
  text-align: start;
  font-size: .95em;
}
.quote-items .quote-subtotal td {
  background: #f7f8f5;
  color: #30463e;
  font-size: .9em;
}
.quote-subtotal strong { float: inline-end; margin-inline-start: .5em; }
.quote-cell-label { display: none; }
.quote-document .q-sum, .quote-document .totals { font-variant-numeric: tabular-nums; }
.quote-document .q-grand {
  padding: 10px 12px;
  border-radius: 6px;
  align-items: baseline;
  gap: 8px;
}
.quote-document .q-grand strong { white-space: nowrap; }
.client-toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.client-toolbar .primary { margin-inline-start: auto; }
.client-status { padding: 10px 12px; border-inline-start: 3px solid var(--pine); background: #eaf1eb; }
#decision h2 { scroll-margin-top: 20px; }

@media screen and (max-width: 480px) {
  .client-toolbar .primary { width: 100%; justify-content: center; margin-inline-start: 0; }
  #decision input, #decision select { font-size: 16px; }
}

@media screen {
  .quote-document { container: quote-sheet / inline-size; }
}
@container quote-sheet (max-width: 374px) {
  .quote-items, .quote-items tbody { display: block; }
  .quote-items thead {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
  }
  .quote-items tr { display: block; }
  .quote-items .quote-line {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 6px 8px;
    padding: 10px 6px;
    border-bottom: 1px solid var(--quote-rule);
  }
  .quote-items .quote-description {
    grid-column: 1 / 3;
    grid-row: 1;
    font-weight: 650;
  }
  .quote-items .quote-description small { font-weight: 400; }
  .quote-items .quote-total { grid-column: 3; grid-row: 1; }
  .quote-items .quote-line td {
    padding: 0;
    border: 0;
    text-align: start;
    overflow-wrap: anywhere;
  }
  .quote-items .quote-line .quote-total,
  .quote-items .quote-line .quote-tax { text-align: end; }
  .quote-items .quote-cell-label {
    display: block;
    color: #4b6057;
    font-size: .83em;
    font-weight: 400;
  }
  .quote-items .q-lot th, .quote-items .quote-subtotal td,
  .quote-items .quote-empty td { display: block; }
}
@media screen and (prefers-reduced-motion: no-preference) {
  .quote-line-updated { animation: quote-line-update .45s ease-out; }
  .quote-total-updated strong { animation: quote-total-update .2s ease-out; }
  @keyframes quote-line-update { from { background: #e0eddf; } }
  @keyframes quote-total-update {
    from { opacity: .65; transform: translateY(2px); }
  }
}
@media print {
  .quote-items { font-size: 9pt; }
  .quote-items thead { display: table-header-group; }
  .quote-items td, .quote-items th { padding: 4pt; }
  .quote-items tr { break-inside: avoid; }
  .quote-items .q-lot { break-after: avoid; }
}

.demoband{background:#f5e8cc;color:#58491d;text-align:center;padding:6px;font:12px Arial,sans-serif}@media print{.demoband{display:none}}</style></head><body><div class="demoband">Aperçu interactif · Données fictives · Les modifications disparaissent à la fermeture ou au rechargement.</div><a class="skip" href="#main">Aller au contenu</a><div id="root"></div><div id="toast" role="status"></div><dialog id="modal"><div id="modalContent"></div></dialog><script type="module">const modules={};let demoApi;
// Ce module est injecté uniquement dans APERCU.html. Tous les exemples restent en mémoire.
function createDemoApi({
  catalog,
  tiers,
  units,
  fields,
  conditions,
  today
}) {
  const company = {
    id: 1,
    version: 1,
    name: 'MA RENOVATION',
    address: 'Marseille',
    email: '',
    phone: '',
    identity: '',
    terms: ''
  };
  const me = {
    id: 1,
    name: 'Atelier démo',
    role: 'Administrateur',
    login: 'demo'
  };
  const clients = [{
    id: crypto.randomUUID(),
    name: 'Camille Martin (exemple)',
    address: 'Marseille 8ᵉ',
    email: '',
    phone: '',
    version: 1
  }, {
    id: crypto.randomUUID(),
    name: 'Atelier du Parc (exemple)',
    address: 'Marseille 6ᵉ',
    phone: '',
    email: '',
    version: 1
  }];
  const line = (i, quantity, lot, tier) => ({
    serviceId: catalog[i].id,
    unit: catalog[i].unit,
    label: catalog[i].label,
    quantity: quantity * 100,
    lot,
    tier,
    price: catalog[i].prices[tier],
    tax: 1000
  });
  const doc = (i, title, status, client, lines) => ({
    id: crypto.randomUUID(),
    number: 'DEV-' + String(i).padStart(5, '0'),
    title,
    status,
    client,
    lines,
    company,
    issued: today(),
    valid: today(30),
    discount: 0,
    deposit: 4000,
    edition:{...modules.edition.newEdition(i===3?'Peinture':'Carrelage'),intro:'Réfection des revêtements selon les prestations détaillées ci-dessous.'},
    version: 1,
    site: client.address,
    terms: company.terms,
    notes: '',
    updated: new Date().toISOString()
  });
  const documents = [doc(1, 'Rénovation de la cuisine', 'Brouillon', clients[0], [line(5, 30, 'Cuisine', 1), line(7, 30, 'Cuisine', 1), line(0, 30, 'Cuisine', 2)]), doc(2, 'Parquet de la boutique', 'Envoyé', clients[1], [line(1, 50, 'Boutique', 0)]), doc(3, 'Peinture du séjour', 'Accepté', clients[0], [line(16, 42, 'Séjour', 1)])];
  const data = {
    me,
    profiles:{},reminders:[],gmail:false,
    company,
    services: catalog.map(s => ({
      ...s,
      version: 1
    })),
    tiers,
    units,
    fields,
    conditions,
    customers: clients,
    documents,
    roles: ['Administrateur', 'Bureau', 'Terrain', 'Lecture'],
    members: [{
      ...me,
      active: 1
    }],
    events: [],
    lastRead: 0,
    ai: false
  };
  function event(action, target) {
    data.events.unshift({
      id: (data.events[0]?.id || 0) + 1,
      actor: me.name,
      time: new Date().toISOString(),
      action,
      target
    });
  }
  event('Exemple de devis préparé', documents[0].id);
  return async (path, o) => {
    if (path.startsWith('document/')) return structuredClone(documents.find(d => d.id === path.slice(9)));
    if(path==='reminder'){const r={...o,version:o.version+1};data.reminders=[...data.reminders.filter(x=>x.id!==r.id),r];return structuredClone(r);}
    if(path==='profile'){data.profiles[o.edition.trade]={...o,version:o.version+1};return structuredClone(data.profiles[o.edition.trade]);}
    if (path === 'state') return structuredClone(data);
    if (path === 'events') return structuredClone(data.events);
    if (path === 'read') {
      data.lastRead = o.id;
      return {};
    }
    if (path === 'company') {
      data.company = {
        ...o,
        version: o.version + 1
      };
      return structuredClone(data.company);
    }
    if (['services', 'customers', 'documents'].includes(path)) {
      const items = data[path],
        i = items.findIndex(x => x.id === o.id);
      const v = {
        ...structuredClone(o),
        version: (o.version || 0) + 1
      };
      if (path === 'documents') {
        v.number = v.number || 'DEV-' + String(items.length + 1).padStart(5, '0');
        v.updated = new Date().toISOString();
      }
      if (i < 0) items.unshift(v);else items[i] = v;
      event('Enregistré dans l’aperçu', v.id);
      return structuredClone(v);
    }
    if (path === 'status') {
      const d = documents.find(d => d.id === o.id);
      if (o.status === 'Validé' && (!d.client.name || !d.lines.length)) throw Error('Renseignez le client et les prestations.');
      d.status = o.status;
      d.version++;
      event('Devis · ' + d.status, d.id);
      return structuredClone(d);
    }
    throw Error('Cette action nécessite l’application serveur incluse dans le ZIP.');
  };
}

const euros = cents => new Intl.NumberFormat('fr-FR', {
  style: 'currency',
  currency: 'EUR'
}).format(cents / 100);
function amounts(lines, discount = 0, deposit = 0) {
  const taxGroups = new Map();
  let gross = 0,
    net = 0;
  for (const l of lines) {
    const raw = Math.round(l.quantity * l.price / 100);
    const base = Math.round(raw * (10000 - discount) / 10000);
    gross += raw;
    net += base;
    taxGroups.set(l.tax, (taxGroups.get(l.tax) || 0) + base);
  }
  const taxes = Array.from(taxGroups, ([rate, base]) => ({
    rate,
    base,
    amount: Math.round(base * rate / 10000)
  })).sort((a, b) => a.rate - b.rate);
  const tax = taxes.reduce((s, t) => s + t.amount, 0),
    total = net + tax;
  return {
    gross,
    discount: gross - net,
    net,
    tax,
    taxes,
    total,
    deposit: Math.round(total * deposit / 10000)
  };
}

return {euros,amounts};})();

// Normalise le format du navigateur en PCM mono 16 kHz pour l’API.
async function wavBase64(blob) {
  const context = new AudioContext();
  let source;
  try {
    source = await context.decodeAudioData(await blob.arrayBuffer());
  } finally {
    await context.close();
  }
  const render = new OfflineAudioContext(1, Math.ceil(source.duration * 16000), 16000);
  const player = render.createBufferSource();
  player.buffer = source;
  player.connect(render.destination);
  player.start();
  const pcm = (await render.startRendering()).getChannelData(0);
  const out = new ArrayBuffer(44 + pcm.length * 2),
    view = new DataView(out);
  function tag(offset, s) {
    for (let i = 0; i < s.length; i++) view.setUint8(offset + i, s.charCodeAt(i));
  }
  tag(0, 'RIFF');
  view.setUint32(4, out.byteLength - 8, true);
  tag(8, 'WAVE');
  tag(12, 'fmt ');
  view.setUint32(16, 16, true);
  view.setUint16(20, 1, true);
  view.setUint16(22, 1, true);
  view.setUint32(24, 16000, true);
  view.setUint32(28, 32000, true);
  view.setUint16(32, 2, true);
  view.setUint16(34, 16, true);
  tag(36, 'data');
  view.setUint32(40, pcm.length * 2, true);
  pcm.forEach((n, i) => view.setInt16(44 + 2 * i, Math.round(Math.max(-1, Math.min(1, n)) * 32767), true));
  const bytes = new Uint8Array(out);
  let text = '';
  for (let i = 0; i < bytes.length; i += 8192) text += String.fromCharCode(...bytes.subarray(i, i + 8192));
  return btoa(text);
}
async function startRecording(done) {
  const stream = await navigator.mediaDevices.getUserMedia({
    audio: true
  });
  try {
    const recorder = new MediaRecorder(stream),
      chunks = [];
    let discard = false;
    recorder.ondataavailable = e => chunks.push(e.data);
    const stop = (cancel = false) => {
      discard = cancel;
      if (recorder.state === 'recording') recorder.stop();
    };
    const timer = setTimeout(() => stop(), 120000);
    recorder.onstop = () => {
      clearTimeout(timer);
      stream.getTracks().forEach(t => t.stop());
      done(discard ? null : new Blob(chunks, {
        type: recorder.mimeType
      }));
    };
    recorder.start();
    return stop;
  } catch (e) {
    stream.getTracks().forEach(t => t.stop());
    throw e;
  }
}

return {wavBase64,startRecording};})();

const colors=['ambre','terre','sauge','ardoise'];
const pairs=arr=>arr.map(v=>[v,v]);
function newEdition(trade='Tous corps d’état'){
  return {trade,color:trades[trade][0],layout:'Atelier',font:'Éditorial',order:'Échéancier puis modalités',logo:'',intro:'',spec:'',supply:'Les fournitures comprises sont précisées pour chaque prestation. Les postes en pose seule prévoient la fourniture du revêtement ou de l’équipement par le client.',timing:'Le calendrier d’intervention sera convenu avec le client après acceptation du devis.',travel:'Déplacement compris dans les prix indiqués.',fee:'Devis gratuit.',waste:'',payment:'Règlement par virement bancaire.',middle:5000};
}
const pct=v=>(v/100).toLocaleString('fr-FR')+' %';
const safeLines=t=>esc(t||'').replaceAll('\n','<br>');
const fact=(label,text)=>text?'<div class="quote-fact"><b>'+esc(label)+'</b><p>'+safeLines(text)+'</p></div>':'';
function installments(total,deposit,middle){
  const first=Math.round(total*deposit/10000);
  const progress=Math.min(total-first,Math.round(total*middle/10000));
  return [first,progress,total-first-progress];
}
const tierLabels = ['Pose seule', 'Fourniture et pose · Essentiel', 'Fourniture et pose · Confort', 'Fourniture et pose · Premium'];

function quoteItems(lines, discount) {
  const groups = [];
  for (const line of lines) {
    const lot = line.lot || '';
    if (groups.at(-1)?.lot !== lot) groups.push({ lot, lines: [] });
    groups.at(-1).lines.push(line);
  }
  const bodies = groups.map(group => {
    const heading = group.lot
      ? '<tr class="q-lot" role="row"><th scope="rowgroup" colspan="5" role="rowheader">' + esc(group.lot) + '</th></tr>'
      : '';
    let lotTotal = 0;
    const rows = group.lines.map(({ label, strong, tier, quantity, unit, price, tax }) => {
      const total = Math.round(quantity * price / 100);
      lotTotal += total;
      const detail = (key, name, value) => '<td class="quote-cell quote-' + key + '" role="cell"><span class="quote-cell-label" aria-hidden="true">' + name + '</span>' + value + '</td>';
      return '<tr class="quote-line" role="row"><td class="quote-description" role="cell">' +
        (strong ? '<strong>' + esc(label) + '</strong>' : esc(label)) +
        '<small>' + esc(tierLabels[tier] || '') + '</small></td>' +
        detail('quantity', 'Quantité', esc((quantity / 100).toLocaleString('fr-FR') + ' ' + unit)) +
        detail('price', 'PU HT', euros(price)) + detail('tax', 'TVA', pct(tax)) +
        detail('total', 'Total HT', euros(total)) + '</tr>';
    }).join('');
    const subtotal = group.lot ? '<tr class="quote-subtotal" role="row"><td colspan="5" role="cell"><span>Sous-total HT' +
      (discount ? ' avant remise' : '') + '</span><strong>' + euros(lotTotal) + '</strong></td></tr>' : '';
    return '<tbody role="rowgroup">' + heading + rows + subtotal + '</tbody>';
  }).join('');
  return '<table class="q-items quote-items" role="table" aria-label="Prestations du devis"><thead role="rowgroup"><tr role="row">' +
    ['Prestation', 'Quantité', 'Prix unitaire HT', 'TVA', 'Total HT'].map(name => '<th scope="col" role="columnheader">' + name + '</th>').join('') +
    '</tr></thead>' + (bodies || '<tbody role="rowgroup"><tr class="quote-empty" role="row"><td colspan="5" role="cell">Ajoutez une prestation pour chiffrer le chantier.</td></tr></tbody>') + '</table>';
}

function editionDialog(d,state,done){
  const e=structuredClone(d.edition||newEdition());
  if(!d.edition)e.middle=Math.min(e.middle,10000-d.deposit);
  const template=select('Domaine','trade',pairs(Object.keys(trades)),e.trade)+select('Couleur du document','color',pairs(colors),e.color)+select('Mise en page','layout',pairs(['Atelier','Compact']),e.layout)+select('Typographie','font',pairs(['Éditorial','Contemporain']),e.font)+select('Ordre des rubriques','order',pairs(['Échéancier puis modalités','Modalités puis échéancier']),e.order);
  dialog('Personnaliser le devis','<form id="editionForm"><div class="fields">'+template+'</div><label>Logo pour ce modèle (PNG ou JPEG, 240 Ko maximum)<input id="customLogo" type="file" accept="image/png,image/jpeg"></label>'+button('resetLogo','Reprendre le logo MA RENOVATION')+'<p id="logoState"></p>'+area('Présentation du chantier','intro',e.intro)+area(trades[e.trade][1],'spec',e.spec)+area('Fournitures comprises et exceptions','supply',e.supply)+area('Début, durée et conditions d’intervention','timing',e.timing)+input('Déplacement','travel',e.travel)+input('Coût du devis','fee',e.fee)+area('Déchets : quantité estimée, tri, enlèvement, points de collecte et coûts','waste',e.waste)+input('Mode de règlement','payment',e.payment)+'<div class="fields">'+input('À la signature (%)','first',d.deposit/100,'number','min="0" max="100" step=".01" required')+input('En cours de chantier (%)','middle',e.middle/100,'number','min="0" max="100" step=".01" required')+'</div><p id="rest"></p>'+button('reuse','Reprendre le modèle du domaine','book')+(state.me.role==='Administrateur'?button('preset','Mémoriser pour ce domaine','check'):'')+'<button class="primary wide">Appliquer au devis</button></form>');
  const f=$('#editionForm'),v=f.elements;
  v.trade.onchange=()=>{v.color.value=trades[v.trade.value][0];v.spec.parentNode.firstChild.textContent=trades[v.trade.value][1];};
  let logo=e.logo||'';
  const logoLabel=()=>$('#logoState').textContent=logo?'Logo personnalisé sélectionné.':'Logo MA RENOVATION.';
  $('#customLogo').onchange=async ev=>{const f=ev.target.files[0];if(!f)return;if(!['image/png','image/jpeg'].includes(f.type)||f.size>240000){toast('Utilisez un PNG ou JPEG de moins de 240 Ko.');return;}
    const data=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(f);}).catch(()=>null);if(data&&$('#logoState')){logo=data;logoLabel();}};
  f.querySelector('[data-act="resetLogo"]').onclick=()=>{logo='';logoLabel();};logoLabel();
  const balance=()=>{const n=Math.round(Number(v.first.value)*100)+Math.round(Number(v.middle.value)*100);v.middle.setCustomValidity(n>10000?'Le total des deux échéances dépasse 100 %.':'');$('#rest').textContent=n<=10000?'Solde à la réception : '+pct(10000-n):'Le total dépasse 100 %.';};
  f.oninput=balance;balance();
  const values=()=>{const data=Object.fromEntries(new FormData(f));const {first,middle,...rest}=data;
    return {first:Math.round(Number(first)*100),edition:{...rest,logo,middle:Math.round(Number(middle)*100)}};};
  const reuse=()=>{const profile=state.profiles?.[v.trade.value]||{first:4000,edition:newEdition(v.trade.value)};
    for(const [k,val] of Object.entries(profile.edition))if(v[k])v[k].value=k==='middle'?val/100:val;
    v.first.value=profile.first/100;logo=profile.edition.logo||'';logoLabel();balance();};
  f.querySelector('[data-act="reuse"]').onclick=reuse;
  const preset=f.querySelector('[data-act="preset"]');
  if(preset)preset.onclick=async()=>{if(!f.reportValidity())return;const data=values();try{
    const saved=await api('profile',{...data,version:state.profiles?.[data.edition.trade]?.version||0});
    (state.profiles||={})[data.edition.trade]=saved;toast('Modèle enregistré pour ce domaine.');
  }catch(e){toast(e.message);}};
  onForm('#editionForm',async o=>{const {first,middle,...terms}=o;done({...terms,logo,middle:Math.round(Number(middle)*100)},Math.round(Number(first)*100));$('#modal').close();});
}

const { $, esc, select, input, button, dialog, api }=modules.ui;
function localRewrite(raw,tone){
  let s=raw.trim().replace(/\s+/g,' ').replace(/\bm(?:2|ètre[s]? carr[ée]s?)\b/gi,'m²')
    .replace(/\bje (?:souhaite|veux) (?:faire )?poser\b/gi,'pose de').replace(/\bon (?:va )?pose(?:r)?\b/gi,'pose de')
    .replace(/\bon (?:va )?enl[eè]ve(?:r)?\b/gi,'dépose de').replace(/\bon (?:va )?pein(?:t|dre)\b/gi,'mise en peinture de')
    .replace(/\ble client (?:fournit|achète) (.+?)(?=[.;]|$)/gi,'$1 à la charge du client')
    .replace(/\b(?:et puis|ensuite on)\b/gi,'puis').replace(/\bde (les|le)\b/g,(_m,v)=>v==='les'?'des':'du');
  if(!s)return '';
  if(tone==='Plus lisible')s=s.replace(/\s*;\s*/g,'.\n').replace(/, puis /g,'.\nPuis ');
  return s.split('\n').map(line=>line[0]?.toLocaleUpperCase('fr')+line.slice(1)).join('\n').replace(/([^.!?])$/,'$1.');
}

 }
 function back(){const b=$('#modal [data-act=ledger]');if(b)b.onclick=show;}

 }

 }
 function payment(i){

 show();

  }

}) {

      ...s,
      ...o,
      prices: state.tiers.map((_, i) => Math.round(Number(o['p' + i]) * 100))
    }));
    modal.close();
    go('Catalogue');
    toast('Catalogue mis à jour.');
  });
}

  }
  main.oninput = render;
  render();
}
function activity(main) {
  main.innerHTML = head('Activité de l’équipe', 'Les 100 derniers événements enregistrés.', actions(button('notify', 'Notifications navigateur', 'bell'), button('read', 'Marquer comme lu', 'check'))) + '<section class="card timeline">' + state.events.map(e => '<div><span class="mark"></span><section><b>' + esc(e.action) + '</b><small>' + esc(e.actor) + ' · ' + esc(new Date(e.time).toLocaleString('fr-FR')) + '</small>' + (state.documents.some(d => d.id === e.target) ? button('open-' + e.target, 'Voir le devis', 'arrow', 'subtle') : '') + '</section>' + (e.id > state.lastRead ? '<span class="badge b4">Nouveau</span>' : '') + '</div>').join('') + '</section>';
}
function settings(main) {
  const c = state.company;
  main.innerHTML = head('Administration', 'Identité de l’entreprise et accès de l’équipe.') + '<div class="admincols"><form class="card pad" id="company"><h2>Entreprise</h2>' + input('Raison sociale', 'name', c.name, 'text', 'required') + area('Adresse', 'address', c.address) + input('Téléphone', 'phone', c.phone) + input('E-mail', 'email', c.email, 'email') + area('Identifiants et mentions professionnelles', 'identity', c.identity) + area('Assurance : assureur, coordonnées, police et couverture géographique','insurance',c.insurance) + area('Médiateur de la consommation : nom et coordonnées','mediator',c.mediator) + area('Conditions par défaut des nouveaux devis', 'terms', c.terms) + '<button class="primary">Enregistrer</button></form><section class="card pad"><header><h2>Équipe</h2>' + button('user', 'Ajouter', 'plus') + '</header>' + state.members.map(m => '<div class="member"><div><b>' + esc(m.name) + '</b><small>' + esc(m.login) + ' · ' + esc(m.role) + ' · ' + (m.active ? 'Actif' : 'Suspendu') + '</small></div>' + button('user-' + m.id, 'Gérer', 'gear', 'subtle') + '</div>').join('') + '<h3>Assistant Gemini</h3><p>' + (state.ai ? 'Clé configurée sur le serveur.' : 'En attente de la clé GEMINI_API_KEY dans le fichier .env du serveur.') + '</p><h3>Notifications sur téléphone</h3><p>' + (state.mobileNotifications ? 'Envoi ntfy configuré.' : 'Le journal intégré est actif. Le serveur peut aussi prévenir un téléphone via un sujet ntfy privé.') + '</p></section></div>';
  onForm('#company', async o => {

    });

function userForm(m) {
  dialog(m ? 'Gérer ' + m.name : 'Nouveau membre', '<form id="member">' + (m ? select('Accès', 'active', [['1', 'Actif'], ['0', 'Suspendu']], m.active) : input('Nom', 'name', '', 'text', 'required') + input('Identifiant', 'login', '', 'text', 'required') + select('Rôle', 'role', state.roles.map(s => [s, s]), 'Terrain')) + input(m ? 'Nouveau mot de passe (facultatif)' : 'Mot de passe (12 caractères minimum)', 'password', '', 'password', (m ? '' : 'required ') + 'minlength="12" autocomplete="new-password"') + '<button class="primary wide">Enregistrer</button></form>');
  onForm('#member', async o => {
    await api('users', m ? {
      id: m.id,
      password: o.password,
      active: o.active === '1'
    } : o, m ? 'PUT' : 'POST');
    modal.close();
    if (m?.id === state.me.id) return login();
    state = await api('state');
    go('Administration');
  });
}
let navigation=0;
async function navigate(destination){
  const ticket=++navigation,from=page,session=epoch;
  if(dirty()&&!confirm('Quitter sans enregistrer les modifications du devis ?'))return;
  const data=await api('state');
  if(ticket!==navigation||page!==from||session!==epoch)return;
  state=data;go(destination,null,true);
}
root.onclick = safe(async e => {
  const a = e.target.closest('[data-act]')?.dataset.act;
  if (!a || !state) return;
  if(page==='Terrain فارسی'&&e.target.closest('.terrain'))return;
  if(a==='terrain'){go('Terrain فارسی');return;}
  if (a.startsWith('nav-')||a.startsWith('tab-')) {
    await navigate(a.slice(4));
  } else if (a.startsWith('recover-')) {
    const d = localDrafts().find(x => x.id === a.slice(8));
    if (!d) return;
    const existing = state.documents.find(x => x.id === d.id);
    if (existing) {
      const live = await api('document/' + d.id);
      if (live.version !== d.version || live.status !== 'Brouillon') {
        if (!confirm('Le devis a évolué. Reprendre la saisie dans un nouveau devis ?')) return;
        const originalId = d.id;
        Object.assign(d, {
          id: crypto.randomUUID(),
          number: '',
          version: 0,
          status: 'Brouillon'
        });
        sessionStorage.setItem('ma-draft-' + state.me.id + '-' + d.id, JSON.stringify(d));
        sessionStorage.removeItem('ma-draft-' + state.me.id + '-' + originalId);
      }
    }
    go('editor', d);
  } else if (a.startsWith('forget-')) {
    if (confirm('Écarter la saisie locale ?')) {
      sessionStorage.removeItem('ma-draft-' + state.me.id + '-' + a.slice(7));
      go('Accueil');
    }
  } else if (a === 'new') go('editor', fresh(state));else if (a.startsWith('open-')) go('editor', await api('document/' + a.slice(5)));else if (a === 'menu') $('#sidebar').classList.toggle('show');else if (a === 'logout') {
    if (dirty() && !confirm('Quitter sans enregistrer le devis ?')) return;
    await api('logout', {});
    for (const d of localDrafts()) sessionStorage.removeItem('ma-draft-' + state.me.id + '-' + d.id);
    login();
  } else if (a === 'service' || a.startsWith('service-')) serviceForm(state.services.find(s => s.id === a.slice(8)));else if (a === 'client' || a.startsWith('client-')) clientForm(state.customers.find(c => c.id === a.slice(7)));else if (a === 'user' || a.startsWith('user-')) userForm(state.members.find(m => m.id === Number(a.slice(5))));else if (a === 'read') {
    state.lastRead = state.events[0]?.id || 0;
    await api('read', {
      id: state.lastRead
    });
    go('Activité');
  } else if (a === 'notify') {
    if (!('Notification' in window)) return toast('Ce navigateur ne propose pas les notifications système.');
    const p = await Notification.requestPermission();
    toast(p === 'granted' ? 'Notifications activées pendant l’ouverture de l’application.' : 'Notifications système désactivées.');
  }
});
async function start() {
  state = await api('state');
  const current = ++epoch;
  if(window.innerWidth<=900)go('Accueil',null,true);else go('editor',state.documents[0],true);clearInterval(poll);
  poll = setInterval(async () => {
    try {
      const events = await api('events');
      if (current !== epoch) return;
      const last = state.events[0]?.id || 0;
      if (events.length && events[0].id > last) {
        state.events = events;
        const b = $('.bar [data-act="nav-Activité"]');
        if (b) b.innerHTML = icon('bell') + 'Activité (' + events.filter(e => e.id > state.lastRead).length + ')';
        if (page === 'Activité') activity($('#main'));
        if ('Notification' in window && Notification.permission === 'granted' && document.hidden) new Notification('QuoteRelay', {
          body: events[0].action
        });
      }
    } catch {}
  }, 20000);
}
window.addEventListener('sessionexpired', login);
window.addEventListener('beforeunload', e => {
  if (dirty()) {
    e.preventDefault();
    e.returnValue = '';
  }
});
if(false) navigator.serviceWorker.register('/sw.js').catch(() => {});
start().catch(login);

return {};})();
